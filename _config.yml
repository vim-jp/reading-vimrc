############################################################################
# 原則 http://jekyllrb.com/docs/configuration/#default-configuration からの
# 差分のみ記述している。記述順序も前述に従う。

### Handling Reading
exclude:
  - 'README.md'
  - 'vendor'
# デフォルトと同じだが「utf-8で記事を書こう」という宣言的な意味合で残した。
encoding: utf-8

### Plugins
plugins:
  - jemoji
  - jekyll-seo-tag

### Serving
baseurl: /reading-vimrc

### Outputting
# デフォルトと同じだが、万が一デフォルトが変わってしまうと記事のURLが変わってし
# まいクリティカルなので、明示的に指定した。
permalink: date

### Markdown Processors
kramdown:
  input: GFM

### Site metadata
title: reading-vimrc
description: vimrc読書会まとめ
url: https://vim-jp.org
